<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trvely | Administración de Candidatos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <img
                src="assets/images/logo.png"
                alt="Trvely"
                class="logo">

            <p class="header-tagline">
                Panel de Administración
            </p>
        </div>
    </header>


    <!-- =====================================================
                    LOGIN
    ===================================================== -->
    <section id="login-section" class="seccion-formulario">
        <div class="container" style="max-width:420px;">

            <div class="form-card">

                <h3>Iniciar Sesión</h3>

                <form id="login-form">

                    <div class="form-group">
                        <label for="email">Correo</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <button type="submit" class="btn-primary-custom" style="width:100%;">
                        Ingresar
                    </button>

                    <p id="login-error" class="login-error"></p>

                </form>

            </div>

        </div>
    </section>


    <!-- =====================================================
                    DASHBOARD
    ===================================================== -->
    <section id="dashboard-section" class="seccion-formulario" style="display:none;">
        <div class="container">

            <div class="admin-header">
                <div>
                    <h2>Candidatos</h2>
                    <p>Seleccioná un candidato para revisar sus documentos.</p>
                </div>

                <button id="logout-btn" class="btn-ver">
                    Cerrar sesión
                </button>
            </div>
<!-- =====================================================
                RESUMEN DEL PROCESO
===================================================== -->

<div class="admin-resumen">
    
 <div class="resumen-card activo" data-estado="">
    <span id="kpi-total" class="resumen-numero">0</span>
    <span class="resumen-texto">Todos</span>
</div>
    
    <div class="resumen-card" data-estado="registrado">
        <span id="kpi-registrados" class="resumen-numero">0</span>
        <span class="resumen-texto">Registrados</span>
    </div>

    <div class="resumen-card" data-estado="documentos_en_revision">
        <span id="kpi-revision" class="resumen-numero">0</span>
        <span class="resumen-texto">En revisión</span>
    </div>

    <div class="resumen-card" data-estado="documentos_rechazados">
        <span id="kpi-rechazados" class="resumen-numero">0</span>
        <span class="resumen-texto">Por corregir</span>
    </div>

    <div class="resumen-card" data-estado="documentos_aprobados">
        <span id="kpi-aprobados" class="resumen-numero">0</span>
        <span class="resumen-texto">Aprobados</span>
    </div>

    <div class="resumen-card" data-estado="contrato_enviado">
        <span id="kpi-contrato" class="resumen-numero">0</span>
        <span class="resumen-texto">Contrato enviado</span>
    </div>

</div>
            <div class="admin-toolbar">

                <input
                    type="text"
                    id="buscar-candidato"
                    class="form-control"
                    placeholder="Buscar por nombre o número de documento...">

                <select id="filtro-estado" class="form-select">
                    <option value="">Todos los estados</option>
                    <option value="registrado">Registrado</option>
                    <option value="documentos_en_revision">En revisión</option>
                    <option value="documentos_aprobados">Aprobado</option>
                    <option value="documentos_rechazados">Rechazado</option>
                    <option value="contrato_enviado">Contrato enviado</option>
                </select>

            </div>

            <div class="admin-layout">

                <div class="admin-lista" id="lista-candidatos">
                    <p class="admin-placeholder">Cargando candidatos...</p>
                </div>

                <div class="admin-detalle" id="detalle-candidato">
                    <p class="admin-placeholder">
                        Seleccioná un candidato de la lista para ver sus documentos.
                    </p>
                </div>

            </div>

        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
